server:
  port: 8091

spring:
  application:
    name: product-service
  cloud:
    nacos:
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: DEMO2
        metadata:
          module: product-provider
          instance: product-a
          priority: 1
          business-service: product-service
          registry: nacos
          version: 1.0.0

demo2:
  instance-id: product-a
  registry: nacos
