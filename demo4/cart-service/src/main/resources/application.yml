server:
  port: 8203

spring:
  application:
    name: demo4-cart-service
  cloud:
    nacos:
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: DEMO4
        metadata:
          module: cart-provider
          version: 1.0.0

demo4:
  internal-token: ${DEMO4_INTERNAL_TOKEN:change-me-internal-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info
