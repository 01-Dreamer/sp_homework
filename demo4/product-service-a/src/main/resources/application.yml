server:
  port: 8201

spring:
  application:
    name: demo4-product-service
  cloud:
    nacos:
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: DEMO4
        metadata:
          module: product-provider
          instance: product-service-a
          version: 1.0.0

demo4:
  instance-name: product-service-a
  internal-token: ${DEMO4_INTERNAL_TOKEN:change-me-internal-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info
