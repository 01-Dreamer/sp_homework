server:
  port: 8202

spring:
  application:
    name: demo4-product-service
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:20230607}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:SERVER_IP_PLACEHOLDER:8848}
        group: DEMO4
        metadata:
          module: product-provider
          instance: product-service-b
          version: 1.0.0

demo4:
  instance-name: product-service-b
  internal-token: ${DEMO4_INTERNAL_TOKEN:demo4-internal-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info
