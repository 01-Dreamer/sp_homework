server:
  port: 8321

spring:
  application:
    name: nacos-product-service
  config:
    import:
      - "optional:nacos:nacos-product-service.yml?group=DEMO5&refreshEnabled=true"
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      config:
        group: ${NACOS_GROUP:DEMO5}
        file-extension: yml
        namespace: ${NACOS_NAMESPACE:}
      discovery:
        group: ${NACOS_GROUP:DEMO5}
        namespace: ${NACOS_NAMESPACE:}

demo5:
  product:
    message: Nacos 本地兜底商品配置
    version: nacos-product-local
    discount-rate: 1.00
    currency: CNY

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,refresh
